org.gradle.jvmargs=-Xmx2560m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# minSdk 36 > targetSdk 28 is intentional (ADR 0002).
android.sync.suppressAgpWarnings=MIN_SDK_VERSION_GREATER_THAN_TARGET_SDK,UNSUPPORTED_PROJECT_OPTION_USE

# The development Mac has 8 GB shared with the emulator: keep the compiler daemon small.
kotlin.daemon.jvmargs=-Xmx1g
