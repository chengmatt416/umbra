<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(700px 420px at 78% 30%, #e9e9e6, transparent 70%), #f6f6f4; font-family: Inter, system-ui, sans-serif; color: #0b0b0b; position: relative; }
  .copy { position: absolute; left: 72px; top: 92px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 12px; font: 700 26px Inter; }
  .brand svg { width: 36px; height: 36px; }
  h1 { font: 600 60px/1.08 "Noto Serif", Georgia, serif; letter-spacing: -.01em; margin: 44px 0 0; }
  h1 span { color: #85857f; display: block; }
  p { font-size: 22px; line-height: 1.5; color: #55554f; margin: 26px 0 0; }
  .pills { display: flex; gap: 10px; margin-top: 30px; }
  .pills b { font: 500 16px Inter; border: 1px solid rgba(0,0,0,.12); background: #fff; border-radius: 999px; padding: 7px 14px; }
  .phone { position: absolute; width: 238px; height: 520px; border-radius: 34px; background: #0d0d0d; box-shadow: 0 40px 80px -30px rgba(0,0,0,.45); }
  .phone img { position: absolute; inset: 7px; width: calc(100% - 14px); height: calc(100% - 14px); object-fit: cover; border-radius: 28px; }
  .a { left: 690px; top: 70px; transform: rotate(-3deg); }
  .b { left: 930px; top: 110px; transform: rotate(3deg); }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4a4a"/><stop offset="1" stop-color="#050505"/></linearGradient></defs><circle cx="16" cy="16" r="14" fill="url(#g)"/><circle cx="21.5" cy="12" r="10.5" fill="#f6f6f4"/></svg>Umbra</div>
    <h1>An agent that lives<span>on your phone.</span></h1>
    <p>Briefs your day, prepares the next step, operates apps and builds code in a real Linux on the same phone, and asks before anything risky.</p>
    <div class="pills"><b>Proactive agents</b><b>Linux in your pocket</b><b>Android 16</b></div>
  </div>
  <div class="phone a"><img src="frame-a.png"></div>
  <div class="phone b"><img src="frame-b.png"></div>
</body></html>
