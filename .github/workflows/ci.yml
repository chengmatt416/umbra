name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the real omp binary the protocol and orchestrator tests run against
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install -g @oh-my-pi/pi-coding-agent@18.6.1 && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Fetch proot (pinned Termux builds) for the rootless Linux mode
        run: runtime-build/proot/fetch.sh
      - name: Verify (build, unit tests, lint; live-device tests skip themselves without a device)
        # The Linux image is built by the rootfs job; this build leaves it out of the APK.
        run: scripts/verify.sh -Pumbra.bundleLinux=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  rootfs:
    name: Linux environment image
    # The image is arm64. A native arm64 runner builds it without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: runtime-build/rootfs/build.sh ci
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            build/rootfs/umbra-rootfs-ci-arm64.tar.xz
            build/rootfs/umbra-rootfs-ci-arm64.tar.xz.sha256
            build/rootfs/umbra-packs-ci-arm64.tar.sha256
            build/rootfs/manifest.json
