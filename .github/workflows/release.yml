name: Release

on:
  push:
    tags: ["v*"]
  # A full build (the Linux environment and the APK that carries it) as workflow artifacts, without publishing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Linux environment the APK carries: Debian + omp, and the offline package repository for the add-ons.
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: runtime-build/rootfs/build.sh ${{ github.ref_name }}
      - name: Collect the distributed runtime's original notices
        run: |
          python3 scripts/third-party-notices.py --rootfs build/rootfs/umbra-rootfs-${{ github.ref_name }}-arm64.tar.xz --packs build/rootfs/umbra-packs-${{ github.ref_name }}-arm64.tar --output build/rootfs/legal
          tar -czf build/rootfs/umbra-runtime-notices-${{ github.ref_name }}.tar.gz -C build/rootfs/legal .
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            build/rootfs/umbra-rootfs-*
            build/rootfs/umbra-packs-*
            build/rootfs/manifest.json
            build/rootfs/umbra-runtime-notices-*.tar.gz

  apk:
    needs: rootfs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: build/rootfs
      - run: runtime-build/proot/fetch.sh
      - name: Refresh JVM dependency notices for this build
        run: |
          ./gradlew --no-configuration-cache -I scripts/third-party.init.gradle :app:thirdPartyArtifacts :node-runner:thirdPartyArtifacts
          python3 scripts/third-party-notices.py --gradle app/build/legal/artifacts.json --gradle node-runner/build/legal/artifacts.json --output third_party/gradle
      - name: Decode the signing key
        env:
          KEYSTORE_B64: ${{ secrets.UMBRA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/umbra.jks"
            echo "UMBRA_KEYSTORE=$RUNNER_TEMP/umbra.jks" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew :app:assembleRelease -Pumbra.linuxVersion=${{ github.ref_name }}
        env:
          UMBRA_KEYSTORE_PASSWORD: ${{ secrets.UMBRA_KEYSTORE_PASSWORD }}
          UMBRA_KEY_ALIAS: ${{ secrets.UMBRA_KEY_ALIAS }}
          UMBRA_KEY_PASSWORD: ${{ secrets.UMBRA_KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk umbra-${{ github.ref_name }}.apk && sha256sum umbra-${{ github.ref_name }}.apk > umbra-${{ github.ref_name }}.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: umbra-*.apk*

  publish:
    needs: [apk, rootfs]
    # Only a version tag publishes a release; a manual run keeps its build as artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            umbra-*.apk
            umbra-*.apk.sha256
            umbra-rootfs-*.tar.xz
            umbra-rootfs-*.tar.xz.sha256
            umbra-runtime-notices-*.tar.gz
