name: Release

on:
  push:
    tags: ["v*"]
  # A full build (the Linux environment and the APK that carries it) as workflow artifacts, without publishing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signing:
    runs-on: ubuntu-latest
    steps:
      - name: Require signing configuration before building a published release
        env:
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
          UMBRA_KEYSTORE_B64: ${{ secrets.UMBRA_KEYSTORE_B64 }}
          UMBRA_KEYSTORE_PASSWORD: ${{ secrets.UMBRA_KEYSTORE_PASSWORD }}
          UMBRA_KEY_PASSWORD: ${{ secrets.UMBRA_KEY_PASSWORD }}
        run: |
          if [[ "$REQUIRE_SIGNING" != "true" ]]; then exit 0; fi
          for required in UMBRA_KEYSTORE_B64 UMBRA_KEYSTORE_PASSWORD UMBRA_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Published releases require $required"
              exit 1
            fi
          done

  # The Linux environment the APK carries: Debian + omp, and the offline package repository for the add-ons.
  rootfs:
    needs: signing
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      LINUX_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: runtime-build/rootfs/build.sh "$LINUX_VERSION"
      - name: Collect the distributed runtime's original notices
        run: |
          python3 scripts/third-party-notices.py --rootfs "build/rootfs/umbra-rootfs-${LINUX_VERSION}-arm64.tar.xz" --packs "build/rootfs/umbra-packs-${LINUX_VERSION}-arm64.tar" --output build/rootfs/legal
          tar -czf "build/rootfs/umbra-runtime-notices-${LINUX_VERSION}.tar.gz" -C build/rootfs/legal .
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            build/rootfs/umbra-rootfs-*
            build/rootfs/umbra-packs-*
            build/rootfs/manifest.json
            build/rootfs/umbra-runtime-notices-*.tar.gz

  apk:
    needs: rootfs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LINUX_VERSION: ${{ github.ref_name }}
      REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: build/rootfs
      - run: runtime-build/proot/fetch.sh
      - name: Refresh JVM dependency notices for this build
        run: |
          ./gradlew --no-configuration-cache -I scripts/third-party.init.gradle :app:thirdPartyArtifacts :node-runner:thirdPartyArtifacts
          python3 scripts/third-party-notices.py --gradle app/build/legal/artifacts.json --gradle node-runner/build/legal/artifacts.json --output third_party/gradle
      - name: Decode the signing key
        env:
          KEYSTORE_B64: ${{ secrets.UMBRA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/umbra.jks"
            echo "UMBRA_KEYSTORE=$RUNNER_TEMP/umbra.jks" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew :app:assembleRelease "-Pumbra.linuxVersion=$LINUX_VERSION" "-Pumbra.requireReleaseSigning=$REQUIRE_SIGNING"
        env:
          UMBRA_KEYSTORE_PASSWORD: ${{ secrets.UMBRA_KEYSTORE_PASSWORD }}
          UMBRA_KEY_ALIAS: ${{ secrets.UMBRA_KEY_ALIAS }}
          UMBRA_KEY_PASSWORD: ${{ secrets.UMBRA_KEY_PASSWORD }}
      - name: Verify the published APK matches its version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          outputs = metadata.get('elements', [])
          expected = os.environ['RELEASE_TAG'].removeprefix('v')
          if not outputs or any(row.get('versionName') != expected for row in outputs):
              raise SystemExit('APK versionName must match the release tag; update app/build.gradle.kts before publishing')
          PYTHON
      - run: cp app/build/outputs/apk/release/app-release.apk "umbra-${LINUX_VERSION}.apk" && sha256sum "umbra-${LINUX_VERSION}.apk" > "umbra-${LINUX_VERSION}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: umbra-*.apk*

  publish:
    needs: [apk, rootfs]
    # Only a version tag publishes a release; a manual run keeps its build as artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            umbra-*.apk
            umbra-*.apk.sha256
            umbra-rootfs-*.tar.xz
            umbra-rootfs-*.tar.xz.sha256
            umbra-runtime-notices-*.tar.gz
